<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a4a;
    }

    .header h1 {
      font-size: 18px;
      color: #00d4aa;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 11px;
      color: #888;
    }

    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }

    .status.error { background: #3a1a1a; color: #ff6b6b; display: block; }
    .status.success { background: #1a3a1a; color: #6bff6b; display: block; }
    .status.info { background: #1a2a3a; color: #6b9fff; display: block; }

    .login-form, .entry-list, .entry-detail { display: none; }
    .login-form.active, .entry-list.active, .entry-detail.active { display: block; }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus { border-color: #00d4aa; }

    button {
      width: 100%;
      padding: 10px;
      background: #00d4aa;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #00b894; }
    button.secondary {
      background: #2a2a4a;
      color: #e0e0e0;
    }
    button.secondary:hover { background: #3a3a5a; }

    .search-box {
      margin-bottom: 12px;
    }

    .entry-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #16213e;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .entry-item:hover { background: #1a2a4e; }

    .entry-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
    }

    .entry-icon {
      width: 20px;
      height: 20px;
      background: #2a2a4a;
      border-radius: 4px;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #00d4aa;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-value {
      display: flex;
      align-items: center;
      background: #16213e;
      border-radius: 6px;
      padding: 8px 12px;
    }

    .field-text {
      flex: 1;
      font-size: 13px;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-text.hidden { color: #888; }

    .copy-btn {
      width: auto;
      padding: 4px 10px;
      background: #2a2a4a;
      color: #00d4aa;
      font-size: 11px;
      margin-left: 8px;
    }

    .autofill-btn {
      margin-top: 12px;
    }

    .back-btn {
      margin-bottom: 12px;
      width: auto;
      padding: 6px 12px;
      background: transparent;
      color: #888;
      font-size: 12px;
    }

    .back-btn:hover { color: #e0e0e0; }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #2a2a4a;
      text-align: center;
    }

    .footer button {
      background: transparent;
      color: #888;
      font-size: 11px;
      padding: 4px;
    }

    .footer button:hover { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>&#128274; Password Vault</h1>
    <p>Local encrypted credential store</p>
  </div>

  <div id="status" class="status"></div>

  <!-- Login Form -->
  <div id="loginForm" class="login-form active">
    <input type="password" id="masterPassword" placeholder="Master password" autofocus>
    <button id="unlockBtn">Unlock Vault</button>
  </div>

  <!-- Entry List -->
  <div id="entryList" class="entry-list">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search entries...">
    </div>
    <div id="entriesContainer"></div>
  </div>

  <!-- Entry Detail -->
  <div id="entryDetail" class="entry-detail">
    <button class="back-btn" id="backBtn">&larr; Back to list</button>

    <div class="field-group">
      <div class="field-label">Entry</div>
      <div class="field-value">
        <span class="field-text" id="detailName"></span>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Username</div>
      <div class="field-value">
        <span class="field-text" id="detailUsername"></span>
        <button class="copy-btn" data-field="username">Copy</button>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Password</div>
      <div class="field-value">
        <span class="field-text hidden" id="detailPassword">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</span>
        <button class="copy-btn" id="togglePwBtn" data-action="toggle">&#128065;</button>
        <button class="copy-btn" data-field="password">Copy</button>
      </div>
    </div>

    <div class="field-group" id="urlGroup" style="display:none">
      <div class="field-label">URL</div>
      <div class="field-value">
        <span class="field-text" id="detailUrl"></span>
        <button class="copy-btn" data-field="url">Copy</button>
      </div>
    </div>

    <button class="autofill-btn" id="autofillBtn">&#128260; Autofill on this page</button>
  </div>

  <div class="footer">
    <button id="logoutBtn">Lock vault</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
