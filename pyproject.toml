[project]
name = "password-vault"
version = "1.0.0"
description = "Encrypted CLI password manager — Argon2id key derivation, AES-256-GCM authenticated encryption, atomic durable writes"
requires-python = ">=3.13"
authors = [
    {name = "khwaab"},
]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=48.0.0",
    "typer>=0.25.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pylint>=3.3.0",
    "yapf>=0.43.0",
]
qr = [
    "qrcode[pil]>=7.0",
]

[project.scripts]
pvt = "password_vault.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/password_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pylint.messages_control]
disable = "C0114,C0115,C0116"

[tool.yapf]
based_on_style = "pep8"
column_limit = 88
